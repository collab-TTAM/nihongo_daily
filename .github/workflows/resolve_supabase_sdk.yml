name: Resolve Supabase SDK lock

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/resolve_supabase_sdk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.4'
          cache: true
      - name: Prepare isolated candidate; do not edit app manifest or lock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('apps/flutter_app/pubspec.yaml').read_text()
          anchor = '  go_router: 14.8.1\n'
          if source.count(anchor) != 1 or '  supabase:' in source or '  http:' in source:
              raise SystemExit('Candidate requires reviewed baseline manifest')
          candidate = source.replace(anchor, anchor + '  supabase: 2.16.5\n  http: 1.6.0\n')
          target = Path('build/sdk-resolution')
          target.mkdir(parents=True)
          (target / 'pubspec.yaml').write_text(candidate)
          PY
      - name: Resolve candidate in disposable workspace
        working-directory: build/sdk-resolution
        run: flutter pub get
      - name: Emit public candidate lock for connected GitHub inspection
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for name in ('pubspec.yaml', 'pubspec.lock'):
              print('SDK_CANDIDATE_' + name + ':' + base64.b64encode(Path('build/sdk-resolution', name).read_bytes()).decode())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: supabase-sdk-lock-candidate
          path: |
            build/sdk-resolution/pubspec.yaml
            build/sdk-resolution/pubspec.lock
          if-no-files-found: error
