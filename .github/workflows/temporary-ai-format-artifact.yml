name: Temporary AI format artifact

on:
  push:
    branches:
      - automation/issue-11-plan-sdk-integration
    paths:
      - .github/workflows/temporary-ai-format-artifact.yml

permissions:
  contents: read

jobs:
  format-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/ai/package-lock.json
      - name: Install pinned AI tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: backend/ai
      - name: Format only the three new quiz host TypeScript files
        run: npx prettier --write src/quiz_report_host.ts test/quiz_report_host.test.ts test/quiz_report_transaction.native.ts
        working-directory: backend/ai
      - name: Upload formatted files for exact source handoff
        uses: actions/upload-artifact@v4
        with:
          name: temporary-ai-format-output
          path: |
            backend/ai/src/quiz_report_host.ts
            backend/ai/test/quiz_report_host.test.ts
            backend/ai/test/quiz_report_transaction.native.ts
          if-no-files-found: error
          retention-days: 1
