name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_flutter: ${{ steps.detect.outputs.has_flutter }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect Flutter project after checkout
        id: detect
        shell: bash
        run: |
          if [ -f apps/flutter_app/pubspec.yaml ]; then
            echo "has_flutter=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_flutter=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check forbidden secret-like files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import fnmatch
          patterns = ('.env', '*.pem', '*.key', 'service-account*.json')
          forbidden = [str(p) for p in Path('.').rglob('*')
                       if p.is_file() and '.git' not in p.parts
                       and any(fnmatch.fnmatch(p.name, pattern) for pattern in patterns)]
          if forbidden:
              raise SystemExit('Forbidden secret-like files: ' + ', '.join(forbidden))
          PY
      - name: Validate project manifest and content JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = [Path('project_manifest.json')]
          paths.extend(sorted(Path('data').rglob('*.json')))
          for path in paths:
              with path.open(encoding='utf-8') as source:
                  json.load(source)
          print(f'Validated {len(paths)} JSON files')
          PY
      - name: Install contract validator
        run: python3 -m pip install -r contracts/requirements.txt
      - name: Validate authored curriculum exports
        run: python3 -m contracts.validate_content
      - name: Validate frozen contracts and regression cases
        run: |
          python3 contracts/validate.py
          python3 -m unittest discover -s contracts -p 'test_*.py' -v

      - name: Validate QA inventory and evidence regressions
        run: |
          python3 scripts/verify_qa.py
          python3 -m unittest discover -s qa -p 'test_*.py' -v

  flutter:
    needs: [repo-sanity, database]
    if: needs.repo-sanity.outputs.has_flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.4'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Run dart format --output=none --set-exit-if-changed .
        run: |
          if dart format --output=none --set-exit-if-changed .; then
            exit 0
          fi
          dart format .
          git diff --exit-code -- .
          exit 1
      - run: flutter analyze
      - run: flutter test
      - name: Verify owned persistent session lifecycle
        run: dart run tool/verify_session_lifecycle.dart
      - name: Verify credential vault validation and ordering
        run: dart run tool/verify_session_vault.dart
      - name: Verify account profile readiness
        run: dart run tool/verify_account.dart
      - name: Verify real IndexedDB transactions in Chrome
        run: flutter test --platform chrome test/features/srs/browser_review_store_check.dart
      - name: Verify browser review page reload
        run: |
          mkdir -p build/browser-restart
          dart compile js tool/verify_browser_reload.dart -o build/browser-restart/main.js
          python3 ../../scripts/verify_browser_review_restart.py build/browser-restart
      - name: Verify native receipt cache retention
        run: dart run tool/verify_receipt_retention.dart
      - name: Verify lossless native journal compaction
        run: dart run tool/verify_journal_compaction.dart
      - name: Verify native durable review restart
        run: dart run tool/verify_durable_review.dart
      - name: Verify durable study recovery with real disk
        run: dart run tool/verify_study_recovery.dart
      - name: Verify completed-study events across process restart
        run: dart run tool/verify_study_session_recovery.dart
      - name: Verify captured-connection lifecycle with explicit fixture dispatch
        run: dart run tool/verify_review_connection.dart
      - name: Download same-run native profile bootstrap projections
        uses: actions/download-artifact@v4
        with:
          name: profile-bootstrap-sql
          path: apps/flutter_app/build/profile-native-input
      - name: Decode native profile projections with captured-session Dart adapter
        run: dart run tool/verify_own_profile.dart build/profile-native-input/profile-bootstrap-sql.json
      - name: Download same-run native SQL queue projections
        uses: actions/download-artifact@v4
        with:
          name: review-queue-sql
          path: apps/flutter_app/build/queue-native-input
      - name: Decode native SQL queue projections with Dart adapter
        run: dart run tool/verify_review_queue.dart build/queue-native-input/review-queue-sql.json build/review-queue-dart.json
      - name: Validate decoded native queue wire output
        working-directory: .
        run: |
          python3 -m pip install -r contracts/requirements.txt
          python3 -m contracts.validate_review_queue apps/flutter_app/build/review-queue-dart.json
      - name: Verify pure SRS golden cases and emit actual wire payloads
        run: |
          mkdir -p build
          dart run tool/verify_srs.dart build/srs-wire-output.json
      - name: Validate actual Dart SRS output against frozen wire contracts
        working-directory: .
        run: |
          python3 -m pip install -r contracts/requirements.txt
          python3 -m contracts.validate_srs_wire apps/flutter_app/build/srs-wire-output.json
      - name: Verify typed review adapter using explicit fixture ports
        run: dart run tool/verify_review_adapter.dart build/review-adapter-output.json
      - name: Validate typed review adapter wire encodings
        working-directory: .
        run: python3 -m contracts.validate_srs_wire apps/flutter_app/build/review-adapter-output.json
      - name: Verify SRS study controller using explicit fixture ports
        run: dart run tool/verify_srs_study.dart build/srs-study-output.json
      - name: Validate SRS study controller wire encodings
        working-directory: .
        run: python3 -m contracts.validate_srs_wire apps/flutter_app/build/srs-study-output.json
      - name: Verify actual Kanji capture wire payloads
        run: dart run tool/verify_kanji.dart build/kanji-wire-output.json
      - name: Validate actual Dart Kanji output against frozen contracts
        working-directory: .
        run: python3 -m contracts.validate_kanji_wire apps/flutter_app/build/kanji-wire-output.json
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web-preview
          path: apps/flutter_app/build/web
          if-no-files-found: error

  windows:
    needs: repo-sanity
    if: needs.repo-sanity.outputs.has_flutter == 'true'
    # Flutter 3.35 supports VS 2022; windows-latest now selects VS 2026.
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.4'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build TEST ONLY Dart-to-Windows vault bridge
        run: flutter build windows --release --target tool/windows_vault_bridge.dart
      - name: Verify actual Dart-to-Windows vault bridge across processes
        shell: pwsh
        run: ./tool/verify_windows_vault_bridge.ps1
      - name: Build configured staging Windows entrypoint with TEST ONLY settings
        run: flutter build windows --release --dart-define=ND_MODE=staging --dart-define=ND_SUPABASE_URL=https://example.supabase.invalid --dart-define=ND_SUPABASE_PUBLIC_KEY=sb_publishable_TEST_ONLY_1234567890
      # Rebuild preview without defines; never publish synthetic/staging settings.
      - run: flutter build windows --release
      - name: Verify actual Windows credential store across processes
        shell: pwsh
        run: |
          cmake -S tool/windows_session_vault -B build/session-vault-probe -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/session-vault-probe --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/session-vault-probe/Release/session_vault_probe.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native receipt cache retention
        run: dart run tool/verify_receipt_retention.dart
      - name: Verify lossless native journal compaction
        run: dart run tool/verify_journal_compaction.dart
      - name: Verify native durable review restart
        run: dart run tool/verify_durable_review.dart
      - name: Verify durable study recovery with real disk
        run: dart run tool/verify_study_recovery.dart
      - name: Verify completed-study events across process restart
        run: dart run tool/verify_study_session_recovery.dart
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-windows-preview
          path: apps/flutter_app/build/windows/x64/runner/Release
          if-no-files-found: error

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nihongo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nihongo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable CI-only database; never a hosted/project credential.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nihongo_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Install review parity validator
        run: python3 -m pip install -r contracts/requirements.txt
      - name: Migration, grants, RLS, replay and concurrent uniqueness
        run: bash scripts/test_database.sh
      - name: Validate profile bootstrap and observed concurrent creation
        run: |
          python3 scripts/export_profiles.py build/profile-bootstrap-sql.json
          python3 scripts/test_profile_concurrency.py
      - name: Publish actual native SQL profile projections
        uses: actions/upload-artifact@v4
        with:
          name: profile-bootstrap-sql
          path: build/profile-bootstrap-sql.json
          if-no-files-found: error
      - name: Publish actual native SQL queue projections
        uses: actions/upload-artifact@v4
        with:
          name: review-queue-sql
          path: build/review-queue-sql.json
          if-no-files-found: error

  ai-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/ai/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - name: Verify schema-generated TypeScript projections
        working-directory: .
        run: |
          python3 backend/ai/generate_types.py
          cd backend/ai
          npm run format
          git diff --exit-code -- src/wire.ts
