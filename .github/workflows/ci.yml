name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_flutter: ${{ steps.detect.outputs.has_flutter }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect Flutter project after checkout
        id: detect
        shell: bash
        run: |
          if [ -f apps/flutter_app/pubspec.yaml ]; then
            echo "has_flutter=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_flutter=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check forbidden secret-like files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import fnmatch
          patterns = ('.env', '*.pem', '*.key', 'service-account*.json')
          forbidden = [str(p) for p in Path('.').rglob('*')
                       if p.is_file() and '.git' not in p.parts
                       and any(fnmatch.fnmatch(p.name, pattern) for pattern in patterns)]
          if forbidden:
              raise SystemExit('Forbidden secret-like files: ' + ', '.join(forbidden))
          PY
      - name: Validate project manifest and content JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = [Path('project_manifest.json')]
          paths.extend(sorted(Path('data').rglob('*.json')))
          for path in paths:
              with path.open(encoding='utf-8') as source:
                  json.load(source)
          print(f'Validated {len(paths)} JSON files')
          PY
      - name: Install contract validator
        run: python3 -m pip install -r contracts/requirements.txt
      - name: Validate authored curriculum exports
        run: python3 -m contracts.validate_content
      - name: Export canonical N5 quiz source order
        run: python3 scripts/export_quiz_source_order.py --level N5 > "$RUNNER_TEMP/quiz-source-order-n5.json"
      - name: Run quiz source-order export regressions
        run: python3 -m unittest scripts.test_quiz_source_order_export -v
      - name: Verify preview packaging provenance and integrity
        run: python3 -m unittest scripts.test_package_preview -v
      - name: Validate frozen contracts and regression cases
        run: |
          python3 contracts/validate.py
          python3 -m unittest discover -s contracts -p 'test_*.py' -v

      - name: Validate QA inventory and evidence regressions
        run: |
          python3 scripts/verify_qa.py
          python3 -m unittest discover -s qa -p 'test_*.py' -v
      - name: Verify hosted Supabase workflow remains manual and secret-scoped
        run: python3 scripts/test_hosted_workflow.py
      - name: Test hosted Supabase probe without secrets
        run: python3 -m unittest scripts.test_hosted_supabase_probe -v
      - name: Test collision-free local Supabase port selection
        run: python3 scripts/test_local_supabase_ports.py

  supabase-integration:
    needs: repo-sanity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter SDK for local Supabase runtime probe
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.4'
          cache: true
      - name: Resolve pinned Flutter dependencies for local SDK integration
        run: flutter pub get --enforce-lockfile
        working-directory: apps/flutter_app
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.122.0
      - name: Select collision-free local Supabase ports
        run: python3 scripts/prepare_local_supabase_ports.py "$GITHUB_ENV"
      - name: Start disposable local Supabase services
        shell: bash
        run: |
          log_file="$RUNNER_TEMP/supabase-start.log"
          trap 'rm -f "$log_file"' EXIT
          if supabase start -x studio,edge-runtime,imgproxy,logflare,vector >"$log_file" 2>&1; then
            exit 0
          else
            start_status=$?
            echo "::error::Disposable Supabase startup failed (exit ${start_status}); sanitized diagnostics follow."
            python3 scripts/redact_supabase_start_log.py "$log_file" --tail 120
            exit "$start_status"
          fi
      - name: Apply repository migrations to the local stack
        run: supabase db reset --local
      - name: Export only validated local integration settings
        shell: bash
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase-local.env"
          python3 - "$RUNNER_TEMP/supabase-local.env" "$GITHUB_ENV" <<'PY'
          import os
          import shlex
          import sys
          from pathlib import Path
          from urllib.parse import urlsplit

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          allowed = {"ANON_KEY", "API_URL", "DB_URL", "JWT_SECRET"}
          values = {}

          for raw_line in source.read_text(encoding="utf-8").splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#"):
                  continue
              key, separator, raw_value = line.partition("=")
              if not separator or key not in allowed:
                  continue
              parsed = shlex.split(raw_value, posix=True)
              if len(parsed) != 1 or "\n" in parsed[0] or "\r" in parsed[0]:
                  raise SystemExit("Invalid local Supabase environment value")
              values[key] = parsed[0]

          missing = allowed.difference(values)
          if missing:
              raise SystemExit("Missing required local Supabase settings: " + ", ".join(sorted(missing)))

          try:
              selected_ports = {
                  "api": int(os.environ["ND_LOCAL_SUPABASE_API_PORT"]),
                  "db": int(os.environ["ND_LOCAL_SUPABASE_DB_PORT"]),
                  "shadow": int(os.environ["ND_LOCAL_SUPABASE_SHADOW_PORT"]),
              }
          except (KeyError, ValueError):
              raise SystemExit("Selected local Supabase ports are unavailable") from None
          if (
              len(set(selected_ports.values())) != 3
              or any(not 1024 <= port <= 65535 for port in selected_ports.values())
          ):
              raise SystemExit("Selected local Supabase ports are invalid")

          api = urlsplit(values["API_URL"])
          database = urlsplit(values["DB_URL"])
          if (
              (api.scheme, api.hostname, api.port)
              != ("http", "127.0.0.1", selected_ports["api"])
          ):
              raise SystemExit("Local Supabase API URL is not the selected loopback endpoint")
          if (
              database.scheme not in ("postgres", "postgresql")
              or database.hostname != "127.0.0.1"
              or database.port != selected_ports["db"]
              or database.path != "/postgres"
              or database.username != "postgres"
              or not database.password
          ):
              raise SystemExit("Local Supabase database URL is not the selected loopback database")
          if len(values["JWT_SECRET"]) < 32 or not values["ANON_KEY"]:
              raise SystemExit("Local Supabase Auth settings are incomplete")

          def escape_workflow_command(value):
              return (
                  value.replace("%", "%25")
                  .replace("\r", "%0D")
                  .replace("\n", "%0A")
              )

          for key in ("ANON_KEY", "DB_URL", "JWT_SECRET"):
              print(f"::add-mask::{escape_workflow_command(values[key])}")

          with target.open("a", encoding="utf-8") as output:
              for key in sorted(allowed):
                  output.write(f"{key}={values[key]}\n")

          print("Exported four validated local-only Supabase settings; values redacted.")
          PY
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Seed one TEST ONLY active vocabulary item
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/local_integration_seed.sql
      - name: Verify local GoTrue, PostgREST, rotation, replay and A/B RLS
        run: python3 scripts/test_supabase_local.py
      - name: Stop disposable local Supabase services
        if: always()
        run: supabase stop --no-backup || true


  flutter:
    needs: [repo-sanity, database]
    if: needs.repo-sanity.outputs.has_flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.4'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Run dart format --output=none --set-exit-if-changed .
        id: dart_format
        run: |
          if dart format --output=none --set-exit-if-changed .; then
            exit 0
          fi
          dart format .
          git diff --exit-code -- .
          exit 1
      - name: Show Dart formatter diff on failure
        if: always()
        run: |
          if [[ "${{ steps.dart_format.outcome }}" == "failure" ]]; then
            git diff -- .
          else
            echo "No formatter diff to show."
          fi
      - run: flutter analyze
      - run: flutter test
      - name: Verify owned persistent session lifecycle
        run: dart run tool/verify_session_lifecycle.dart
      - name: Verify credential vault validation and ordering
        run: dart run tool/verify_session_vault.dart
      - name: Verify account profile readiness
        run: dart run tool/verify_account.dart
      - name: Verify real IndexedDB transactions in Chrome
        run: flutter test --platform chrome test/features/srs/browser_review_store_check.dart
      - name: Verify browser quiz history transactions in Chrome
        run: flutter test --platform chrome test/features/quiz/browser_quiz_history_check.dart
      - name: Verify browser completed-study transactions in Chrome
        run: flutter test --platform chrome test/features/daily_plan/browser_study_session_store_check.dart
      - name: Verify browser Japanese speech synthesis in Chrome
        run: flutter test --platform chrome test/features/audio/japanese_speech_web_check.dart
      - name: Verify browser review page reload
        run: |
          mkdir -p build/browser-restart
          dart compile js tool/verify_browser_reload.dart -o build/browser-restart/main.js
          python3 ../../scripts/verify_browser_review_restart.py build/browser-restart
      - name: Verify native receipt cache retention
        run: dart run tool/verify_receipt_retention.dart
      - name: Verify lossless native journal compaction
        run: dart run tool/verify_journal_compaction.dart
      - name: Verify native durable review restart
        run: dart run tool/verify_durable_review.dart
      - name: Verify durable study recovery with real disk
        run: dart run tool/verify_study_recovery.dart
      - name: Verify completed-study events across process restart
        run: dart run tool/verify_study_session_recovery.dart
      - name: Verify captured-connection lifecycle with explicit fixture dispatch
        run: dart run tool/verify_review_connection.dart
      - name: Download same-run native profile bootstrap projections
        uses: actions/download-artifact@v4
        with:
          name: profile-bootstrap-sql
          path: apps/flutter_app/build/profile-native-input
      - name: Decode native profile projections with captured-session Dart adapter
        run: dart run tool/verify_own_profile.dart build/profile-native-input/profile-bootstrap-sql.json
      - name: Download same-run native SQL queue projections
        uses: actions/download-artifact@v4
        with:
          name: review-queue-sql
          path: apps/flutter_app/build/queue-native-input
      - name: Decode native SQL queue projections with Dart adapter
        run: dart run tool/verify_review_queue.dart build/queue-native-input/review-queue-sql.json build/review-queue-dart.json
      - name: Validate decoded native queue wire output
        working-directory: .
        run: |
          python3 -m pip install -r contracts/requirements.txt
          python3 -m contracts.validate_review_queue apps/flutter_app/build/review-queue-dart.json
      - name: Verify pure SRS golden cases and emit actual wire payloads
        run: |
          mkdir -p build
          dart run tool/verify_srs.dart build/srs-wire-output.json
      - name: Validate actual Dart SRS output against frozen wire contracts
        working-directory: .
        run: |
          python3 -m pip install -r contracts/requirements.txt
          python3 -m contracts.validate_srs_wire apps/flutter_app/build/srs-wire-output.json
      - name: Verify typed review adapter using explicit fixture ports
        run: dart run tool/verify_review_adapter.dart build/review-adapter-output.json
      - name: Validate typed review adapter wire encodings
        working-directory: .
        run: python3 -m contracts.validate_srs_wire apps/flutter_app/build/review-adapter-output.json
      - name: Verify SRS study controller using explicit fixture ports
        run: dart run tool/verify_srs_study.dart build/srs-study-output.json
      - name: Validate SRS study controller wire encodings
        working-directory: .
        run: python3 -m contracts.validate_srs_wire apps/flutter_app/build/srs-study-output.json
      - name: Verify actual Kanji capture wire payloads
        run: dart run tool/verify_kanji.dart build/kanji-wire-output.json
      - name: Validate actual Dart Kanji output against frozen contracts
        working-directory: .
        run: python3 -m contracts.validate_kanji_wire apps/flutter_app/build/kanji-wire-output.json
      - run: flutter build web --release
      - name: Record web preview provenance and checksums
        working-directory: .
        env:
          ND_PREVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/package_preview.py --platform web --root apps/flutter_app/build/web
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web-preview
          path: apps/flutter_app/build/web
          if-no-files-found: error

  windows:
    needs: repo-sanity
    if: needs.repo-sanity.outputs.has_flutter == 'true'
    # Flutter 3.35 supports VS 2022; windows-latest now selects VS 2026.
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.4'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build TEST ONLY Dart-to-Windows vault bridge
        run: flutter build windows --release --target tool/windows_vault_bridge.dart
      - name: Verify actual Dart-to-Windows vault bridge across processes
        shell: pwsh
        run: ./tool/verify_windows_vault_bridge.ps1
      - name: Build configured staging Windows entrypoint with TEST ONLY settings
        run: flutter build windows --release --dart-define=ND_MODE=staging --dart-define=ND_SUPABASE_URL=https://example.supabase.invalid --dart-define=ND_SUPABASE_PUBLIC_KEY=sb_publishable_TEST_ONLY_1234567890
      # Rebuild preview without defines; never publish synthetic/staging settings.
      - run: flutter build windows --release
      - name: Verify actual Windows credential store across processes
        shell: pwsh
        run: |
          cmake -S tool/windows_session_vault -B build/session-vault-probe -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/session-vault-probe --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/session-vault-probe/Release/session_vault_probe.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native receipt cache retention
        run: dart run tool/verify_receipt_retention.dart
      - name: Verify lossless native journal compaction
        run: dart run tool/verify_journal_compaction.dart
      - name: Verify native durable review restart
        run: dart run tool/verify_durable_review.dart
      - name: Verify durable study recovery with real disk
        run: dart run tool/verify_study_recovery.dart
      - name: Verify completed-study events across process restart
        run: dart run tool/verify_study_session_recovery.dart
      - name: Verify native quiz history journals on Windows
        run: flutter test test/features/quiz/native_vocabulary_quiz_journal_test.dart test/features/quiz/native_grammar_quiz_journal_test.dart
      - name: Record Windows preview provenance and checksums
        working-directory: .
        env:
          ND_PREVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/package_preview.py --platform windows --root apps/flutter_app/build/windows/x64/runner/Release
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-windows-preview
          path: apps/flutter_app/build/windows/x64/runner/Release
          if-no-files-found: error

  preview-artifacts:
    needs: [repo-sanity, flutter, windows]
    if: needs.repo-sanity.outputs.has_flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download exact Web preview artifact
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-preview
          path: ${{ runner.temp }}/verified-web-preview
      - name: Verify downloaded Web preview bytes and provenance
        env:
          ND_PREVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/package_preview.py --verify-ci --platform web --root "${{ runner.temp }}/verified-web-preview"
      - name: Download exact Windows preview artifact
        uses: actions/download-artifact@v4
        with:
          name: flutter-windows-preview
          path: ${{ runner.temp }}/verified-windows-preview
      - name: Verify downloaded Windows preview bytes and provenance
        env:
          ND_PREVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/package_preview.py --verify-ci --platform windows --root "${{ runner.temp }}/verified-windows-preview"

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nihongo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nihongo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable CI-only database; never a hosted/project credential.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nihongo_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Install review parity validator
        run: python3 -m pip install -r contracts/requirements.txt
      - name: Migration, grants, RLS, replay and concurrent uniqueness
        run: bash scripts/test_database.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/ai/package-lock.json
      - name: Install pinned AI PostgreSQL adapter dependencies
        working-directory: backend/ai
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify committed AI quota adapter with native PostgreSQL
        working-directory: backend/ai
        run: npm run test:postgres-quota
      - name: Verify text context adapter with native PostgreSQL
        working-directory: backend/ai
        run: npm run test:postgres-text
      - name: Verify atomic conversation adapter with native PostgreSQL
        working-directory: backend/ai
        run: npm run test:postgres-conversation
      - name: Verify quiz report coordinator and SQL bridge with native PostgreSQL
        working-directory: backend/ai
        run: npm run test:postgres-quiz
      - name: Verify trusted AI assembly with native PostgreSQL
        working-directory: backend/ai
        run: npm run test:postgres-assembly
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 'v2.9.6'
      - name: Verify AI PostgreSQL adapters with pinned Deno
        working-directory: backend/ai
        run: |
          deno --version
          deno task test:postgres
      - name: Verify bundled Edge PostgreSQL assembly
        working-directory: backend/ai
        run: |
          deno fmt --check edge
          deno task bundle:edge-postgres
          mkdir -p ../../build/edge-postgres/main
          cp edge/postgres_main.ts ../../build/edge-postgres/main/index.ts
          python3 ../../scripts/verify_edge_postgres.py
      - name: Publish Edge PostgreSQL assembly evidence
        uses: actions/upload-artifact@v4
        with:
          name: ai-edge-postgres-assembly
          path: build/edge-postgres/evidence.json
          if-no-files-found: error
      - name: Validate profile bootstrap and observed concurrent creation
        run: |
          python3 scripts/export_profiles.py build/profile-bootstrap-sql.json
          python3 scripts/test_profile_concurrency.py
      - name: Publish actual native SQL profile projections
        uses: actions/upload-artifact@v4
        with:
          name: profile-bootstrap-sql
          path: build/profile-bootstrap-sql.json
          if-no-files-found: error
      - name: Publish actual native SQL queue projections
        uses: actions/upload-artifact@v4
        with:
          name: review-queue-sql
          path: build/review-queue-sql.json
          if-no-files-found: error

  ai-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/ai/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 'v2.9.6'
      - name: Check AI modules with pinned Deno
        run: |
          deno --version
          deno fmt --check deno deno.json
          deno task check
      - name: Verify AI boundary with pinned Deno
        run: deno task test
      - name: Verify Deno native HTTP and permission boundaries
        run: deno task test:web
      - name: Verify bundled quiz report v2 Supabase Edge Function
        run: |
          deno fmt --check edge/quiz_report_v2_edge.ts ../../supabase/functions/quiz-report-v2/index.ts
          deno fmt --check ../../supabase/functions/quiz-report-v2-lookup/index.ts
          deno fmt --check ../../supabase/functions/quiz-report-v2-history/index.ts
          deno task bundle:quiz-report-v2
          deno task bundle:quiz-report-v2-lookup
          deno task bundle:quiz-report-v2-history
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          config = tomllib.loads(Path("../../supabase/config.toml").read_text(encoding="utf-8"))
          assert config.get("functions", {}).get("quiz-report-v2", {}).get("verify_jwt") is True
          assert config.get("functions", {}).get("quiz-report-v2-lookup", {}).get("verify_jwt") is True
          assert config.get("functions", {}).get("quiz-report-v2-history", {}).get("verify_jwt") is True
          print("All three quiz v2 functions explicitly enable gateway JWT verification")
          PY
      - name: Verify bundled Supabase Edge user worker
        run: |
          deno fmt --check edge
          deno task bundle:edge
          mkdir -p ../../build/edge/main
          cp edge/main.ts ../../build/edge/main/index.ts
          python3 ../../scripts/verify_edge_user_worker.py
      - name: Publish Edge user-worker compatibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: ai-edge-user-worker
          path: build/edge/evidence.json
          if-no-files-found: error
      - name: Verify schema-generated TypeScript projections
        working-directory: .
        run: |
          python3 backend/ai/generate_types.py
          cd backend/ai
          npm run format
          git diff --exit-code -- src/wire.ts
