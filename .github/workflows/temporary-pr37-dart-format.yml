name: Temporary PR 37 Dart formatter output

on:
  push:
    branches:
      - automation/issue-22-atomic-review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          cache: false
      - name: Resolve locked Flutter dependencies
        working-directory: apps/flutter_app
        run: flutter pub get --enforce-lockfile
      - name: Produce exact pinned Dart formatter patch
        working-directory: apps/flutter_app
        shell: bash
        run: |
          dart format test/features/srs/windows_persistent_supabase_runtime_test.dart
          git diff -- test/features/srs/windows_persistent_supabase_runtime_test.dart > "$RUNNER_TEMP/dart-format.patch"
          test -s "$RUNNER_TEMP/dart-format.patch"
          cp test/features/srs/windows_persistent_supabase_runtime_test.dart "$RUNNER_TEMP/windows_persistent_supabase_runtime_test.dart"
      - uses: actions/upload-artifact@v4
        with:
          name: pr37-dart-format-output
          path: |
            ${{ runner.temp }}/dart-format.patch
            ${{ runner.temp }}/windows_persistent_supabase_runtime_test.dart
          if-no-files-found: error
          retention-days: 1
