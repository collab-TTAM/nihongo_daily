name: nihongo_daily
description: Personal-first Japanese learning app for Vietnamese learners.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  flutter_riverpod: 2.6.1
  go_router: 14.8.1
  supabase: 2.16.5
  http: 1.6.0
  logging: 1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/curriculum/n5/vocabulary.json
    - assets/curriculum/n5/grammar.json
    - assets/curriculum/n4/vocabulary.json
    - assets/curriculum/n4/grammar.json
